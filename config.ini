# ============================================================
# Weekly Update Tracker — Configuration
# ============================================================
# Fill in YOUR details below. No coding needed — just edit
# the values after the = sign and save the file.
# ============================================================

[TRACKER]
# Path to your Excel tracker file (relative to this config, or absolute)
excel_file = PTH_progress_tracking.xlsx

# Name of the sheet tab inside the Excel file that contains the task list.
# Use `auto` to let the script detect a matching sheet from headers.
sheet_name = auto

# Windows Credential Manager service name (used to store/retrieve password)
# Change this if multiple teams use the tracker on the same machine
credential_service = Weekly_Update_Tracker

[IDENTITY]
# Your first name exactly as it appears in emails/Teams greetings
# e.g.  "Hi Kandhan"  →  first_name = Kandhan
first_name = Kandhan

# Your last name (surname)
last_name = Rajakumar

# Your display name as it appears in Outlook/Teams sender list
# Format is usually  "LastName, FirstName"
display_name = Rajakumar, Kandhan


[EMAIL]
# Your company SMTP server (ask IT if unsure)
smtp_host = smtp.intel.com

# SMTP port — usually 587 (TLS) or 465 (SSL)
smtp_port = 25

# Your own email address (this will be the "From" address)
smtp_user = kandhan.rajakumar@intel.com

# Your email password
# TIP: If your company uses SSO/Outlook, ask IT for an app password
smtp_pass = YOUR_PASSWORD_HERE

# Team distribution list — weekly summary goes here every Friday
team_email = mpe_mdna_ba_pth@intel.com


[OWNERS]
# Map each owner name (exactly as it appears in Excel) to their email.
# Format:  Name = email@intel.com
# For names with a typo in the sheet, add both variants.
