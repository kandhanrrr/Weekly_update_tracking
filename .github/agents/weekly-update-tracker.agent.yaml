name: weekly-update-tracker
description: >-
  Runs weekly tracker follow-up and reminder flow on a user-provided Excel
  workbook. Weekly task does not auto-create a workbook.
model: claude-sonnet-4.6
skills:
  - weekly-tracker-reminder
tools:
  - run_in_terminal
  - read_file
  - grep_search
  - file_search
workflow:
  - step: validate_tracker_config
    command: >-
      python -c "import configparser, pathlib; p=pathlib.Path('config.ini'); c=configparser.ConfigParser(); c.read(p); print('excel_file=', c.get('TRACKER','excel_file',fallback='')); print('sheet_name=', c.get('TRACKER','sheet_name',fallback='auto'))"
  - step: dry_run
    command: python scripts/weekly/run_weekly_tracker.py
  - step: live_send_only_if_requested
    command: python scripts/weekly/run_weekly_tracker.py --send
  - step: force_weekly_summary_if_requested
    command: python scripts/weekly/run_weekly_tracker.py --send --weekly-summary
  - step: generate_html_tab_view
    command: python scripts/weekly/generate_weekly_html_report.py
behavior:
  readme_contract:
    - Source of truth: docs/weekly-tracking/WEEKLY_TRACKING_README.md
    - Follow this README deliverables whenever weekly-update-tracker agent is called.
  execution_policy:
    - On every invocation, read docs/weekly-tracking/WEEKLY_TRACKING_README.md first.
    - Execute only weekly-task scope from that README.
    - Return output strictly in the README-defined weekly format.
    - Do not mix AR workflow when this weekly agent is called.
  workbook_policy:
    - User-provided workbook is required for weekly tracking.
    - Do not auto-create weekly workbook in this agent.
  status_scope:
    include:
      - WIP
      - Open
      - Not yet started
    equivalent_wording_supported:
      - In Progress
      - In-Progress
      - Active
      - Ongoing
      - Not Started
      - Todo
      - To Do
      - Planned
      - Pending
      - New
      - Reopened
accuracy_contract:
  - Output deliverable is weekly reminder run output only (dry-run/live-send logs).
  - Never create workbook artifacts in weekly agent flow.
  - Include module-wise status summary table in output (Module, Completed, Open, WIP, Not yet started, Dropped, Total).
  - Generate HTML tab report at artifacts/weekly/weekly_tracker_report.html.
  - Follow up only for active items (WIP/Open/Not yet started and equivalents).
  - Start reminders 2 days before ETA.
  - Continue follow-up until status is Closed/Completed equivalents.
  - Never send live emails unless explicitly requested.
output_format_contract:
  - Present output in tab-style sections in this order.
  - Tab: Overview
  - Tab: Module-wise Status Summary
  - Tab: Overdue Owners
  - Tab: Dispatch Summary
  - Each tab must include concise tables/metrics per docs/weekly-tracking/WEEKLY_TRACKING_README.md.
  - Hover detail requirement for visuals: Category labels, type/status context, Max, Upper fence, Q3, Median, Mean, Q1, Lower fence.
  - For non-chart tabs, provide the same details in expanded row/detail panels.
